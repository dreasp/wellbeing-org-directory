<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Org Directory</title>
<style>
  :root {
    --bg: #F6F5F1;
    --ink: #232823;
    --ink-soft: #5C645C;
    --line: #DAD8D0;
    --accent: #3D5C4E;
    --accent-soft: #E4EAE5;
    --card: #FFFFFF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Iowan Old Style', 'Georgia', serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 48px 32px 28px;
    border-bottom: 1px solid var(--line);
  }

  header h1 {
    margin: 0 0 6px;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 14px;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  }

  .stats-row {
    display: flex;
    gap: 24px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .stat {
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .stat b {
    color: var(--ink);
    font-size: 15px;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px;
  }

  .filters {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  }

  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 3px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 28px;
  }

  .toggle-row label {
    font-size: 13px;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    color: var(--ink-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .toggle-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  .count-line {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 12px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--line);
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    font-size: 13px;
    color: var(--ink-soft);
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    font-weight: 500;
    padding: 10px 8px;
    border-bottom: 1px solid var(--line);
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  }

  tbody tr {
    border-bottom: 1px solid var(--line);
  }

  tbody tr:hover {
    background: var(--accent-soft);
  }

  tbody td {
    padding: 12px 8px;
    font-size: 14px;
    vertical-align: top;
  }

  .org-name {
    font-weight: 600;
  }

  .org-meta {
    font-size: 12px;
    color: var(--ink-soft);
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    margin-top: 2px;
  }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  }

  a.site-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
  }

  a.site-link:hover { text-decoration: underline; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }

  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    padding: 28px 0;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    font-size: 13px;
  }

  .pagination button {
    padding: 8px 14px;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
  }

  .pagination button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .pagination button:not(:disabled):hover {
    border-color: var(--accent);
  }

  .page-jump {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .page-jump-input {
    width: 60px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 3px;
    font-family: inherit;
    font-size: 13px;
    text-align: center;
  }

  #pageJumpGo {
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--card);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
  }

  #pageJumpGo:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .row-actions {
    white-space: nowrap;
    text-align: right;
  }

  .edit-btn, .save-btn, .cancel-btn {
    padding: 6px 12px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--card);
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    font-size: 11px;
    cursor: pointer;
    color: var(--ink);
    margin-left: 4px;
  }

  .edit-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .save-btn {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .save-btn:hover {
    background: #2E4A3E;
  }

  .cancel-btn:hover {
    border-color: #A83B3B;
    color: #A83B3B;
  }

  .edit-input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--accent);
    border-radius: 3px;
    font-size: 13px;
    font-family: inherit;
    background: var(--card);
  }

  .checkbox-cell {
    width: 32px;
    text-align: center;
  }

  .checkbox-cell input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  .delete-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 3px;
  }

  .delete-btn:hover {
    background: #F5DEDE;
    color: #A83B3B;
  }

  .visited-row {
    background: #FBF3D9;
  }

  .visited-row:hover {
    background: #F5EBC4;
  }

  .visited-check {
    cursor: pointer;
  }

  .bulk-bar {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 14px 20px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    z-index: 100;
  }

  .bulk-delete-btn, .bulk-cancel-btn {
    padding: 8px 14px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
  }

  .bulk-delete-btn {
    background: #A83B3B;
    color: white;
  }

  .bulk-delete-btn:hover {
    background: #8E2F2F;
  }

  .bulk-cancel-btn {
    background: transparent;
    color: var(--bg);
    border: 1px solid #555;
  }

  .bulk-cancel-btn:hover {
    border-color: var(--bg);
  }

  .add-org-btn {
    padding: 8px 14px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: white;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    font-size: 12px;
  }

  .add-org-btn:hover {
    background: #2E4A3E;
  }

  .add-org-form {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 16px;
    margin-bottom: 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  .add-org-form input, .add-org-form select {
    flex: 1;
    min-width: 140px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    font-family: inherit;
    font-size: 13px;
  }

  .add-org-form button {
    padding: 8px 16px;
    border-radius: 3px;
    border: 1px solid var(--line);
    cursor: pointer;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    font-size: 12px;
  }

  #saveNewOrgBtn {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .loading {
    text-align: center;
    padding: 60px;
    color: var(--ink-soft);
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    font-size: 13px;
  }

  @media (max-width: 720px) {
    .filters { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>Org Directory</h1>
  <p>Mental health organizations, hospitals, clinics &amp; social services — searchable registry</p>
  <div class="stats-row" id="statsRow"></div>
</header>

<main>
  <div class="filters">
    <div class="field">
      <label for="search">Search name</label>
      <input type="text" id="search" placeholder="e.g. Mind, Crisis, Counselling...">
    </div>
    <div class="field">
      <label for="country">Country</label>
      <select id="country">
        <option value="">All countries</option>
      </select>
    </div>
    <div class="field">
      <label for="category">Category</label>
      <select id="category">
        <option value="">All categories</option>
        <option value="mental health">Mental health</option>
        <option value="psychiatric">Psychiatric</option>
        <option value="counsel">Counselling</option>
        <option value="social">Social work</option>
        <option value="crisis">Crisis services</option>
        <option value="addiction">Addiction/substance</option>
      </select>
    </div>
    <div class="field">
      <label for="city">City</label>
      <input type="text" id="city" placeholder="e.g. London, Toronto...">
    </div>
  </div>

  <div class="toggle-row">
    <label>
      <input type="checkbox" id="visitedOnly">
      Show only organizations I've highlighted (visited)
    </label>
  </div>

  <div class="count-line">
    <span id="resultCount">Loading...</span>
    <button id="addOrgBtn" class="add-org-btn">+ Add Organization</button>
  </div>

  <div id="addOrgForm" class="add-org-form" style="display:none;">
    <input type="text" id="newName" placeholder="Organization name*">
    <select id="newCountry">
      <option value="">Country*</option>
      <option value="UK">UK</option>
      <option value="US">US</option>
      <option value="Canada">Canada</option>
      <option value="Australia">Australia</option>
      <option value="New Zealand">New Zealand</option>
      <option value="Ireland">Ireland</option>
    </select>
    <input type="text" id="newCity" placeholder="City">
    <input type="text" id="newWebsite" placeholder="Website (https://...)">
    <button id="saveNewOrgBtn">Save</button>
    <button id="cancelNewOrgBtn">Cancel</button>
  </div>

  <div id="tableContainer"></div>

  <div class="bulk-bar" id="bulkBar" style="display:none;">
    <span id="bulkCount"></span>
    <button class="bulk-delete-btn" onclick="bulkDelete()">Delete selected</button>
    <button class="bulk-cancel-btn" onclick="clearSelection()">Cancel</button>
  </div>

  <div class="pagination" id="paginationContainer" style="display:none;">
    <button id="prevBtn">&larr; Previous</button>
    <span class="page-jump">
      Page <input type="number" id="pageJumpInput" min="1" class="page-jump-input"> of <span id="pageJumpTotal"></span>
      <button id="pageJumpGo">Go</button>
    </span>
    <button id="nextBtn">Next &rarr;</button>
  </div>
</main>

<script>
  const API_BASE = 'https://wellbeing-org-directory.onrender.com';

  let currentPage = 1;
  let debounceTimer = null;

  async function loadStats() {
    try {
      const res = await fetch(`${API_BASE}/api/stats`);
      const data = await res.json();
      const statsRow = document.getElementById('statsRow');
      statsRow.innerHTML = data.map(s =>
        `<div class="stat"><b>${Number(s.count).toLocaleString()}</b> ${s.country}</div>`
      ).join('');

      const countrySelect = document.getElementById('country');
      data.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.country;
        opt.textContent = s.country;
        countrySelect.appendChild(opt);
      });
    } catch (err) {
      console.error('Failed to load stats', err);
    }
  }

  function buildQuery() {
    const params = new URLSearchParams();
    const search = document.getElementById('search').value.trim();
    const country = document.getElementById('country').value;
    const category = document.getElementById('category').value;
    const city = document.getElementById('city').value.trim();
    const visitedOnly = document.getElementById('visitedOnly').checked;

    if (search) params.set('search', search);
    if (country) params.set('country', country);
    if (category) params.set('category', category);
    if (city) params.set('city', city);
    if (visitedOnly) params.set('visited', 'true');
    params.set('page', currentPage);
    params.set('limit', 30);

    return params.toString();
  }

  async function loadResults() {
    const container = document.getElementById('tableContainer');
    container.innerHTML = '<div class="loading">Loading results...</div>';

    try {
      const query = buildQuery();
      const res = await fetch(`${API_BASE}/api/organizations?${query}`);
      const data = await res.json();

      document.getElementById('resultCount').textContent =
        `${data.total.toLocaleString()} organization${data.total === 1 ? '' : 's'} found`;

      if (data.organizations.length === 0) {
        container.innerHTML = '<div class="empty-state">No organizations match these filters. Try broadening your search.</div>';
        document.getElementById('paginationContainer').style.display = 'none';
        return;
      }

      const rows = data.organizations.map(org => `
        <tr data-id="${org.id}" class="${org.visited ? 'visited-row' : ''}">
          <td class="checkbox-cell"><input type="checkbox" class="row-check" data-id="${org.id}"></td>
          <td class="checkbox-cell">
            <input type="checkbox" class="visited-check" data-id="${org.id}" ${org.visited ? 'checked' : ''} title="Mark as visited">
          </td>
          <td>
            <div class="org-name" data-field="name" data-id="${org.id}">${escapeHtml(org.name)}</div>
            <div class="org-meta">${escapeHtml(org.registry_id || '')} &middot; ${escapeHtml(org.registry_source || '')}</div>
          </td>
          <td><span class="badge">${escapeHtml(org.country)}</span></td>
          <td class="editable-field" data-field="city" data-id="${org.id}">${escapeHtml(org.city || org.region || '')}</td>
          <td class="editable-field editable-site" data-field="website" data-id="${org.id}">${org.website ? `<a class="site-link" href="${escapeHtml(org.website)}" target="_blank" rel="noopener">${escapeHtml(org.website)}</a>` : '<span class="org-meta">No website found</span>'}</td>
          <td class="row-actions">
            <button class="edit-btn" data-id="${org.id}" title="Edit this entry">Edit</button>
            <button class="delete-btn" data-id="${org.id}" title="Delete this entry">&times;</button>
          </td>
        </tr>
      `).join('');

      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th class="checkbox-cell"><input type="checkbox" id="selectAll" title="Select all on this page"></th>
              <th class="checkbox-cell" title="Visited">&#10003;</th>
              <th>Organization</th>
              <th>Country</th>
              <th>Location</th>
              <th>Website</th>
              <th></th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      attachEditListeners();
      attachSelectionListeners();
      attachVisitedListeners();

      const pagination = document.getElementById('paginationContainer');
      pagination.style.display = 'flex';
      document.getElementById('pageJumpInput').value = data.page;
      document.getElementById('pageJumpInput').max = data.totalPages;
      document.getElementById('pageJumpTotal').textContent = data.totalPages.toLocaleString();
      document.getElementById('prevBtn').disabled = data.page <= 1;
      document.getElementById('nextBtn').disabled = data.page >= data.totalPages;

    } catch (err) {
      container.innerHTML = '<div class="empty-state">Could not reach the API. Is the server running?</div>';
      console.error(err);
    }
  }

  function attachVisitedListeners() {
    document.querySelectorAll('.visited-check').forEach(cb => {
      cb.addEventListener('change', async () => {
        const id = cb.dataset.id;
        const row = cb.closest('tr');

        try {
          const res = await fetch(`${API_BASE}/api/organizations/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ visited: cb.checked })
          });
          if (res.ok) {
            row.classList.toggle('visited-row', cb.checked);
            // If we're currently filtering to visited-only and someone
            // unchecks a row, remove it from view immediately
            if (document.getElementById('visitedOnly').checked && !cb.checked) {
              setTimeout(() => loadResults(), 300);
            }
          } else {
            cb.checked = !cb.checked;
          }
        } catch (err) {
          console.error('Failed to update visited status', err);
          cb.checked = !cb.checked;
        }
      });
    });
  }

  function attachSelectionListeners() {
    const selectAll = document.getElementById('selectAll');
    const checkboxes = document.querySelectorAll('.row-check');

    selectAll.addEventListener('change', () => {
      checkboxes.forEach(cb => { cb.checked = selectAll.checked; });
      updateBulkBar();
    });

    checkboxes.forEach(cb => {
      cb.addEventListener('change', updateBulkBar);
    });
  }

  function updateBulkBar() {
    const checked = document.querySelectorAll('.row-check:checked');
    const bar = document.getElementById('bulkBar');

    if (checked.length === 0) {
      bar.style.display = 'none';
      return;
    }

    bar.style.display = 'flex';
    document.getElementById('bulkCount').textContent = `${checked.length} selected`;
  }

  function clearSelection() {
    document.querySelectorAll('.row-check').forEach(cb => { cb.checked = false; });
    const selectAll = document.getElementById('selectAll');
    if (selectAll) selectAll.checked = false;
    document.getElementById('bulkBar').style.display = 'none';
  }

  async function bulkDelete() {
    const checked = Array.from(document.querySelectorAll('.row-check:checked'));
    const ids = checked.map(cb => cb.dataset.id);

    if (ids.length === 0) return;
    if (!confirm(`Delete ${ids.length} selected organizations? This cannot be undone.`)) return;

    try {
      const res = await fetch(`${API_BASE}/api/organizations/bulk-delete`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids })
      });
      if (res.ok) {
        document.getElementById('bulkBar').style.display = 'none';
        loadResults();
      }
    } catch (err) {
      console.error('Failed to bulk delete', err);
    }
  }

  function attachEditListeners() {
    const container = document.getElementById('tableContainer');
    container.onclick = async (e) => {
      const editBtn = e.target.closest('.edit-btn');
      const saveBtn = e.target.closest('.save-btn');
      const cancelBtn = e.target.closest('.cancel-btn');
      const deleteBtn = e.target.closest('.delete-btn');

      if (editBtn) {
        enterEditMode(editBtn.dataset.id);
      } else if (saveBtn) {
        const row = saveBtn.closest('tr');
        await saveEdit(saveBtn.dataset.id, row);
      } else if (cancelBtn) {
        loadResults();
      } else if (deleteBtn) {
        const row = deleteBtn.closest('tr');
        const name = row.querySelector('.org-name').textContent.trim();
        if (!confirm(`Delete "${name || 'this entry'}"? This cannot be undone.`)) return;
        try {
          const res = await fetch(`${API_BASE}/api/organizations/${deleteBtn.dataset.id}`, { method: 'DELETE' });
          if (res.ok) loadResults();
        } catch (err) {
          console.error('Failed to delete', err);
        }
      }
    };
  }

  function enterEditMode(id) {
    const row = document.querySelector(`tr[data-id="${id}"]`);
    const nameCell = row.querySelector('[data-field="name"]');
    const cityCell = row.querySelector('[data-field="city"]');
    const siteCell = row.querySelector('[data-field="website"]');
    const actionsCell = row.querySelector('.row-actions');

    const currentName = nameCell.textContent.trim();
    const currentCity = cityCell.textContent.trim();
    const currentSite = siteCell.querySelector('a') ? siteCell.querySelector('a').getAttribute('href') : '';

    nameCell.innerHTML = `<input type="text" class="edit-input" value="${escapeAttr(currentName)}">`;
    cityCell.innerHTML = `<input type="text" class="edit-input" value="${escapeAttr(currentCity)}">`;
    siteCell.innerHTML = `<input type="text" class="edit-input" placeholder="https://..." value="${escapeAttr(currentSite)}">`;

    actionsCell.innerHTML = `
      <button class="save-btn" data-id="${id}">Save</button>
      <button class="cancel-btn" data-id="${id}">Cancel</button>
    `;

    row.querySelector('[data-field="name"] input').focus();
  }

  async function saveEdit(id, row) {
    const nameInput = row.querySelector('[data-field="name"] input');
    const cityInput = row.querySelector('[data-field="city"] input');
    const siteInput = row.querySelector('[data-field="website"] input');

    const payload = {
      name: nameInput.value.trim(),
      city: cityInput.value.trim(),
      website: siteInput.value.trim()
    };

    try {
      const res = await fetch(`${API_BASE}/api/organizations/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        loadResults();
      } else {
        alert('Save failed - please try again.');
      }
    } catch (err) {
      console.error('Failed to save edit', err);
      alert('Save failed - please try again.');
    }
  }

  function escapeAttr(str) {
    if (!str) return '';
    return str.replace(/"/g, '&quot;');
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function debouncedReload() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      currentPage = 1;
      loadResults();
    }, 350);
  }

  document.getElementById('search').addEventListener('input', debouncedReload);
  document.getElementById('city').addEventListener('input', debouncedReload);
  document.getElementById('country').addEventListener('change', debouncedReload);
  document.getElementById('category').addEventListener('change', debouncedReload);
  document.getElementById('visitedOnly').addEventListener('change', () => {
    currentPage = 1;
    loadResults();
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentPage > 1) { currentPage--; loadResults(); }
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    currentPage++; loadResults();
  });

  document.getElementById('pageJumpGo').addEventListener('click', jumpToPage);
  document.getElementById('pageJumpInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') jumpToPage();
  });

  function jumpToPage() {
    const input = document.getElementById('pageJumpInput');
    const target = parseInt(input.value);
    const max = parseInt(input.max) || 1;
    if (target >= 1 && target <= max) {
      currentPage = target;
      loadResults();
    } else {
      input.value = currentPage;
    }
  }

  document.getElementById('addOrgBtn').addEventListener('click', () => {
    document.getElementById('addOrgForm').style.display = 'flex';
    document.getElementById('newName').focus();
  });

  document.getElementById('cancelNewOrgBtn').addEventListener('click', () => {
    document.getElementById('addOrgForm').style.display = 'none';
    clearNewOrgForm();
  });

  document.getElementById('saveNewOrgBtn').addEventListener('click', async () => {
    const name = document.getElementById('newName').value.trim();
    const country = document.getElementById('newCountry').value;
    const city = document.getElementById('newCity').value.trim();
    const website = document.getElementById('newWebsite').value.trim();

    if (!name || !country) {
      alert('Name and country are required.');
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/organizations`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, country, city, website })
      });

      if (res.ok) {
        document.getElementById('addOrgForm').style.display = 'none';
        clearNewOrgForm();
        currentPage = 1;
        loadResults();
      } else {
        alert('Failed to add organization - please try again.');
      }
    } catch (err) {
      console.error('Failed to add organization', err);
      alert('Failed to add organization - please try again.');
    }
  });

  function clearNewOrgForm() {
    document.getElementById('newName').value = '';
    document.getElementById('newCountry').value = '';
    document.getElementById('newCity').value = '';
    document.getElementById('newWebsite').value = '';
  }

  loadStats();
  loadResults();
</script>

</body>
</html>
